name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI verifies changes and must never publish packages.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so `changeset status --since=origin/main` can
          # resolve the base branch on both push and pull_request events.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Plain install until pnpm-lock.yaml can be generated and committed
        # (currently blocked: @hobiri/website-runtime is not on the registry).
        # Tighten to --frozen-lockfile once the lockfile exists.
        run: pnpm install

      - name: Build pluma-vite
        # Template typecheck, tests, and builds resolve @hobiri/pluma-vite
        # through its generated dist/ declarations, so it builds first.
        run: pnpm --filter @hobiri/pluma-vite build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint template
        run: pnpm --filter @hobiri/pluma-template lint

      - name: Check formatting
        run: pnpm --filter @hobiri/pluma-template format:check

      - name: Validate changesets
        # Fails loudly on an invalid config or on malformed changesets for
        # changed packages; exits cleanly when there is simply nothing
        # pending (e.g. documentation-only changes). Changesets that touch
        # no changed package surface strictly at version time instead,
        # before anything is published. Plain `changeset status` is not
        # used because pull request checkouts have no local `main` ref.
        run: pnpm changeset status --since=origin/main
